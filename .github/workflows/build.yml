name: Build

# 打包产物：三端 WebExtension zip；推送到 main、打标签或在 macOS 上构建 Safari App
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # 自动同步用自己的 token 合并 PR，这样产生的 main push 不会触发工作流，
  # 所以再挂一条：同步工作流跑完就打包发布
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: ">=23.7.0"

jobs:
  # 由同步工作流触发时，先确认这次真的缺一个 Release，否则每天的例行检查都会白跑一遍全量打包
  gate:
    name: 是否需要构建
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: 判断
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_run" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          if gh release view "${version}" >/dev/null 2>&1; then
            echo "Release ${version} 已存在，跳过这次由同步工作流触发的构建。"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Release ${version} 还没有，开始打包。"
          echo "build=true" >> "$GITHUB_OUTPUT"

  check:
    name: 类型与站点定义检查
    needs: gate
    # 自动同步的 PR 首次触发时跳过：同一提交刚由 upstream-sync 验证过，而且它几秒内
    # 就被合并，PR 检查只会因为合并 ref 消失而空跑。人工往同步分支推解决方案时照常检查
    if: >-
      needs.gate.outputs.build == 'true' &&
      (github.event_name != 'pull_request' || github.head_ref != 'codex/upstream-sync' || github.event.action != 'opened') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: pnpm check

  extension:
    name: WebExtension (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox, safari]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 WebExtension
        run: |
          case "${{ matrix.target }}" in
            chrome) pnpm build:dist ;;
            firefox) pnpm build:dist-firefox ;;
            safari) pnpm build:dist-safari ;;
          esac

      - name: 计算产物名称
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          baseline="$(tr -d '[:space:]' < .upstream-synced)"
          {
            echo "version=${version}"
            echo "archive=build/PT-Depiler-${version}-${baseline:0:8}-${{ matrix.target }}-extension.zip"
          } >> "$GITHUB_OUTPUT"

      - name: 打包 zip
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p build
          (cd "dist-${TARGET}" && zip -qr "${GITHUB_WORKSPACE}/${ARCHIVE}" .)
          unzip -l "${ARCHIVE}" | tail -n 3

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: PT-Depiler-${{ steps.meta.outputs.version }}-${{ matrix.target }}-extension
          path: ${{ steps.meta.outputs.archive }}

  app:
    name: Safari App (macOS)
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建未签名 App
        run: pnpm build:safari-app

      - name: ad-hoc 签名并打包
        id: pack
        run: |
          app="safari-project/DerivedData/Build/Products/Debug/PT-Depiler.app"
          if [[ ! -d "${app}" ]]; then
            echo "::error::未找到构建产物 ${app}"
            exit 1
          fi
          # CI 上没有开发者证书，只能做 ad-hoc 签名；产物供测试使用
          if ! codesign --force --deep --sign - "${app}"; then
            echo "::warning::ad-hoc 签名失败，产物保持未签名"
          fi
          version="$(node -p "require('./package.json').version")"
          baseline="$(tr -d '[:space:]' < .upstream-synced)"
          archive="build/PT-Depiler-${version}-${baseline:0:8}-macOS.app.zip"
          mkdir -p build
          ditto -c -k --sequesterRsrc --keepParent "${app}" "${archive}"
          {
            echo "version=${version}"
            echo "archive=${archive}"
          } >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: PT-Depiler-${{ steps.pack.outputs.version }}-macOS-app
          path: ${{ steps.pack.outputs.archive }}

  release:
    name: 发布 Release
    needs: [extension, app]
    # main 上按 package.json 的 version 发版；显式推标签发同名 Release 也一样
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          pattern: PT-Depiler-*
          path: release-assets
          merge-multiple: true

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(release-assets/*.zip)
          if [[ ! -e "${assets[0]}" ]]; then
            echo "::error::没有可发布的产物"
            exit 1
          fi

          # 推标签时用标签名，推 main 时用 package.json 里的版本号
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            tag="$(node -p "require('./package.json').version")"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} 已存在，本次跳过（要重发就先删掉它）。"
            exit 0
          fi

          baseline="$(tr -d '[:space:]' < .upstream-synced)"
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo "PT-Depiler Safari 移植版 ${tag}，上游基线 [\`${baseline:0:8}\`](https://github.com/pt-plugins/PT-depiler/commit/${baseline})。"
            echo
            if prev="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null)" && [[ "${prev}" != "${tag}" ]]; then
              echo "与上一版的差异：[\`${prev}...${tag}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag})。"
              echo
            fi
            echo "- \`PT-Depiler-${tag}-*-chrome-extension.zip\` / \`-firefox-extension.zip\` / \`-safari-extension.zip\`：WebExtension 构建产物，解压后即为可直接加载的扩展目录。"
            echo "- \`PT-Depiler-${tag}-*-macOS.app.zip\`：在 GitHub macOS runner 上构建的 Safari App，未使用开发者证书，仅做 ad-hoc 签名。从浏览器下载后需先执行 \`xattr -dr com.apple.quarantine PT-Depiler.app\` 去除隔离标记；要在 Safari 中长期使用仍需用自己的开发者证书签名。"
          } > "${notes}"

          if ! gh release create "${tag}" --latest --target "${GITHUB_SHA}" --title "PT-Depiler ${tag}" --notes-file "${notes}" "${assets[@]}"; then
            # 连着推两次 main 时，两个运行可能同时抢着建同一个 Release
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} 已被并行的运行创建，改为补传本次产物。"
              gh release upload "${tag}" "${assets[@]}" --clobber
            else
              echo "::error::无法创建 Release ${tag}；如果是不再需要的残留标签/Release，先删掉再重跑。"
              exit 1
            fi
          fi
